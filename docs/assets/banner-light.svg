<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ferrum Sign: Send documents for electronic signature, with sealed PDFs and a checkable audit trail.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eae9fc"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#645ce8"/><stop offset="1" stop-color="#4940d3"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#4f46e5" fill-opacity="0.12"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/></filter>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
    <style>
      text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .sheen { animation: sweep 9s ease-in-out infinite; }
      .tile { animation: float 7s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-480px) skewX(-18deg); } 60%, 100% { transform: translateX(1760px) skewX(-18deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) { .sheen, .tile { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <circle cx="1150" cy="20" r="230" fill="#4f46e5" fill-opacity="0.07"/>
    <circle cx="1240" cy="350" r="150" fill="#4f46e5" fill-opacity="0.06"/>
    <rect class="sheen" x="0" y="-60" width="260" height="480" fill="url(#sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="none" stroke="#d8d6f9"/>
  <g class="tile"><g transform="translate(72 102)" filter="url(#shadow)"><rect width="144" height="144" rx="36" fill="url(#tile)"/><g transform="translate(36 36) scale(3)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 17-2.156-1.868A.5.5 0 0 0 18 15.5v.5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1c0-2.545-3.991-3.97-8.5-4a1 1 0 0 0 0 5c4.153 0 4.745-11.295 5.708-13.5a2.5 2.5 0 1 1 3.31 3.284"/><path d="M3 21h18"/></g></g></g>
  <text x="264" y="138" font-size="17" font-weight="700" fill="#4f46e5" letter-spacing="2.4">FERRUM APP</text>
  <text x="262" y="198" font-size="58" font-weight="750" fill="#0f172a" letter-spacing="-1">Ferrum Sign</text>
  <text x="264" y="244" font-size="23" fill="#475569">Send documents for electronic signature,</text>
  <text x="264" y="278" font-size="23" fill="#475569">with sealed PDFs and a checkable audit trail.</text>
  <g><rect x="264" y="310" width="70" height="30" rx="15" fill="#e6e5fb"/><text x="298.8" y="330" font-size="14.5" font-weight="600" fill="#3b35ac" text-anchor="middle">v0.3.1</text></g>
  <g><rect x="343.6" y="310" width="130" height="30" rx="15" fill="#e6e5fb"/><text x="408.5" y="330" font-size="14.5" font-weight="600" fill="#3b35ac" text-anchor="middle">Own interface</text></g>
  <g><rect x="483.40000000000003" y="310" width="87" height="30" rx="15" fill="#e6e5fb"/><text x="526.8" y="330" font-size="14.5" font-weight="600" fill="#3b35ac" text-anchor="middle">AGPL-3.0</text></g>
</svg>
