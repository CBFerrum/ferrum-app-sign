package: sign
version: 0.3.4
label: Sign
description: Electronic signatures - send PDFs for signing in order or in parallel, place fields per signer, sign by secure link, sealed PDFs with an audit certificate and a hash-chained audit trail.
depends: [core]

modules:
  - name: sign
    label: Sign
    icon: file-signature
    order: 47
    items: [SignRequest, SignTemplate, SignBulkSend, SignEvent, SignSettings, report:sign_requests_by_status, report:sign_completion_time, report:sign_pending_signatures]

roles:
  - name: Sign User
    description: Sends their own documents for signature (uploads or templates), follows them and reads their audit trails.
    permissions:
      - {entity: SignRequest, read: true, write: true, create: true, delete: true, export: true, if_owner: true}
      - {entity: SignEvent, read: true, if_owner: true}
      - {entity: SignTemplate, read: true}
      - {entity: SignSettings, read: true}
      - {entity: SignBulkSend, read: true, write: true, create: true, if_owner: true}
  - name: Sign Manager
    description: Every sign request and audit trail, templates and Sign Settings (including rotating the signing key).
    permissions:
      - {entity: SignRequest, read: true, write: true, create: true, delete: true, export: true}
      - {entity: SignEvent, read: true, export: true}
      - {entity: SignTemplate, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: SignSettings, read: true, write: true, create: true}
      - {entity: SignBulkSend, read: true, write: true, create: true, delete: true}
personal_data:
  - {entity: SignEvent, match: signer_email, retain: "Evidence of the signature: erasing it would undo what was signed"}
  - {entity: SignRequest, match: sender_email, retain: "Evidence of the signature: erasing it would undo what was signed"}
  - {entity: SignBulkSend, match: sender_email, retain: "The record of a bulk send; its recipients' names and addresses are cleared as each request is made"}
handover:
  - {entity: SignRequest, field: sender_email, where: {status: [Draft, Sent, In Progress]}}

# A signer's one-time code (Kernel::send_code): e-mail and text bodies, each reading values.code.
messages:
  - key: sign.signing_code
    label: Signing code
    category: operational
    values: [code]
    languages:
      en:
        email: {subject: "Your code to sign a document", body: "<p>Your code to sign the document you opened is <strong>{{ values.code }}</strong>. It works once, for ten minutes.</p>"}
        text: {text: "Your code to sign the document you opened: {{ values.code }}. It works once, for ten minutes."}
  # The mails of a request, about it (`doc`): a workspace edits their wording in its message templates.
  - key: sign.invitation
    label: Signing invitation
    entity: SignRequest
    category: operational
    channels: [email]
    values: [organization, sender, name, link, until, access_code]
    languages:
      en:
        email:
          subject: "{{ values.organization }}: please sign \"{{ doc.title }}\""
          body: "<p>Hello {{ values.name or 'there' }},</p><p>{{ values.sender }} sent you <strong>{{ doc.title }}</strong> ({{ doc.number }}) to sign.</p>{% if doc.message %}<blockquote style=\"margin:12px 0;padding-left:12px;border-left:3px solid #d0d7de\">{{ doc.message }}</blockquote>{% endif %}<p><a href=\"{{ values.link }}\" style=\"display:inline-block;padding:10px 18px;background:#1f6feb;color:#fff;border-radius:6px;text-decoration:none\">Review and sign</a></p><p style=\"color:#57606a;font-size:13px\">This link is personal: anyone who has it can sign as you, so do not forward it. It works until {{ values.until }}.{% if values.access_code %} You will also need the access code the sender gave you.{% endif %}</p>"
  - key: sign.reminder
    label: Signing reminder
    entity: SignRequest
    category: operational
    channels: [email]
    values: [organization, sender, name, link, until, access_code]
    languages:
      en:
        email:
          subject: "Reminder: please sign \"{{ doc.title }}\""
          body: "<p>Hello {{ values.name or 'there' }},</p><p>{{ values.sender }} is still waiting for your signature on <strong>{{ doc.title }}</strong> ({{ doc.number }}).</p><p><a href=\"{{ values.link }}\" style=\"display:inline-block;padding:10px 18px;background:#1f6feb;color:#fff;border-radius:6px;text-decoration:none\">Review and sign</a></p><p style=\"color:#57606a;font-size:13px\">This link is personal: anyone who has it can sign as you, so do not forward it. It works until {{ values.until }}.{% if values.access_code %} You will also need the access code the sender gave you.{% endif %}</p>"
  - key: sign.voided
    label: Signature request withdrawn
    entity: SignRequest
    category: operational
    channels: [email]
    values: [organization, sender]
    languages:
      en:
        email:
          subject: "Withdrawn: \"{{ doc.title }}\""
          body: "<p>{{ values.sender }} withdrew <strong>{{ doc.title }}</strong> ({{ doc.number }}). It can no longer be signed and your link no longer works.{% if doc.void_reason %} Reason: {{ doc.void_reason }}{% endif %}</p>"
  - key: sign.completed
    label: Signed copy
    entity: SignRequest
    category: operational
    channels: [email]
    values: [organization, sender]
    languages:
      en:
        email:
          subject: "Signed: \"{{ doc.title }}\""
          body: "<p>Everyone has signed <strong>{{ doc.title }}</strong> ({{ doc.number }}). The signed PDF with its audit certificate is attached.</p><p style=\"color:#57606a;font-size:13px\">SHA-256 of the attached file: <code>{{ doc.sealed_sha256 }}</code></p>"

connections:
  - name: sign_timestamp
    label: Time-stamping authority (RFC 3161)
    description:
      base: https://tsa.invalid
      apps: [sign]
      operations:
        stamp:
          label: Time-stamp a signature's digest
          method: POST
          path: /
          body: {file: "{{ inputs.request_file }}", content_type: application/timestamp-query, max_bytes: 4096}
          result: {token_file: {file: {max_bytes: 65536}}}
          inputs: [request_file]
          changes: false

# What a request about another record says when it ends, for processes to wait on (the request's own
# update says it too, for automations): {request, number, status, reference_entity, reference_id, sealed_document}, and a
# voided request's reason.
events:
  - {name: request_completed, label: Signature request completed, entity: SignRequest, description: "Everyone signed; the sealed PDF is on the request"}
  - {name: request_declined, label: Signature request declined, entity: SignRequest}
  - {name: request_expired, label: Signature request expired, entity: SignRequest}
  - {name: request_failed, label: Signature request could not be sent, entity: SignRequest}
  - {name: request_voided, label: Signature request voided, entity: SignRequest, description: "The sender withdrew it; the payload carries the reason"}
