- name: SignSettings
  label: Sign Settings
  kind: settings
  module: sign
  fields:
    - {name: sender_name, type: data, max_length: 100, description: "Name signers see as the sender in emails and on the signing page (default: the workspace name)"}
    - {name: public_url, type: url, label: Public URL, description: "Address this server is reached at from the internet (e.g. https://erp.example.com), for signing links in emails; empty = where the platform sends people outside the workspace"}
    - {name: link_expiry_days, type: int, default: 30, min: 1, max: 365, description: "Requests without an expiry date close this many days after they are sent; their signing links stop working then"}
    - {name: reminder_every_days, type: int, default: 3, min: 0, max: 60, description: "Signers whose turn it is are reminded after this many days without signing, then at the same interval; 0 = no automatic reminders"}
    - {name: max_reminders, type: int, default: 3, min: 0, max: 20, description: "Automatic reminders per signer at most"}
    - {name: seal, type: select, options: [Workspace Key, None], default: Workspace Key, description: "What digitally seals every finished document: the workspace's own key (made at the first seal, kept in the vault), or nothing. A seal key and certificate from a certificate authority, set below, replace the made ones"}
    - {name: seal_certificate, type: text, max_length: 20000, read_only: true, description: "PEM: the seal's certificate and its chain, the seal's own first. A self-signed one is made with the first seal; Set Seal replaces it with a certificate authority's"}
    - {name: seal_key, type: secret, read_only: true, hidden: true, description: "The seal's private key (PKCS#8 PEM, curve P-256 or P-384; RSA keys are not accepted), made with the first seal or set by Set Seal"}
    - {name: timestamp_connection, type: data, max_length: 63, description: "The name of a time-stamping authority's connection (RFC 3161, a copy of the Sign Timestamp template): every seal then carries its time stamp"}
    - {name: bulk_per_day, type: int, default: 2000, min: 1, max: 100000, description: "Requests that bulk sends may make in 24 hours; sending pauses at the limit and goes on when room is free"}
    - {name: brand, type: link, to: Brand, description: "The brand signers see on the signing page (empty: the address's or the workspace's own)"}
    - {name: consent_text, type: text, max_length: 1000, description: "What signers agree to before they sign, in your own words (empty: Sign's sentence, in the signer's language); printed on the certificate"}
    - {name: signing_key, type: secret, read_only: true, hidden: true, description: "HMAC key that signs signer links and salts IP hashes; created automatically. Rotating it retires every outstanding link"}
  actions:
    - name: rotate_signing_key
      label: Rotate Signing Key
      permission: write
      confirm: "Every signing link sent so far stops working; use Resend Links on open requests afterwards. Continue?"
      contract:
        effect: transactional_action
        returns: {type: object, properties: {rotated: {type: boolean}}}
        completion: "A new signing key is stored; every link sent before it stops working"
    - name: set_seal
      label: Set Seal
      permission: write
      confirm: "Every document sealed from now on is sealed with this key and certificate. Continue?"
      params:
        - {name: seal_key, type: secret, label: Seal Key, required: true, description: "The private key, PKCS#8 PEM, on curve P-256 or P-384 (RSA keys are not accepted)"}
        - {name: seal_certificate, type: text, label: Certificate, required: true, description: "PEM: the certificate for that key and its chain, the key's own certificate first"}
      contract:
        effect: transactional_action
        returns: {type: object, properties: {sealed_by: {type: string}}}
        completion: "The key and certificate are stored (the key in the vault); every document sealed from now on carries a seal by them"
    - name: allow_embedding
      label: Allow Embedding
      permission: write
      params:
        - {name: origins, type: text, label: Sites, required: true, description: "The sites that may show the signing page in a frame, one per line as https://www.example.com (at most ten; http only for localhost)"}
      contract:
        effect: transactional_action
        returns: {type: object, properties: {page: {type: string, const: "sign/s"}}}
        completion: "The signing page may be shown in a frame on exactly these sites (the workspace's Embedding for sign/s holds them)"

- name: SignTemplateRole
  label: Sign Template Role
  kind: child
  fields:
    - {name: role, type: data, required: true, max_length: 60, in_list: true, description: "e.g. Client or Company: fields are placed per role"}
    - {name: signing_order, type: int, label: Order, default: 1, min: 1, max: 50, in_list: true, description: "Sequential requests go to lower numbers first; equal numbers sign in parallel"}
    - {name: default_name, type: data, max_length: 140, in_list: true}
    - {name: default_email, type: email, in_list: true, description: "Prefilled for this role on new requests (e.g. your own signatory)"}

- name: SignField
  label: Sign Field
  kind: child
  fields:
    - {name: role, type: data, required: true, max_length: 60, in_list: true, description: "The signer role that fills this field"}
    - {name: field_type, type: select, label: Type, required: true, default: Signature, options: [Signature, Initials, Date Signed, Name, Text, Checkbox, Dropdown, Radio, Number, Attachment], in_list: true}
    - {name: label, type: data, max_length: 100, in_list: true, description: "Shown to the signer, e.g. Company name"}
    - {name: page, type: int, required: true, default: 1, min: 1, max: 1000, in_list: true}
    - {name: x, type: decimal, required: true, min: 0, max: 14400, in_list: true, description: "Points (1/72 inch) from the left edge of the page as displayed"}
    - {name: y, type: decimal, required: true, min: 0, max: 14400, in_list: true, description: "Points from the top edge of the page as displayed"}
    - {name: width, type: decimal, required: true, min: 4, max: 14400, in_list: true}
    - {name: height, type: decimal, required: true, min: 4, max: 14400, in_list: true}
    - {name: required, type: check, default: true, in_list: true}
    - {name: document_no, type: int, default: 1, min: 1, max: 20, in_list: true, description: "Which document of the request the box is on: 1 is the main document, then More Documents in order"}
    - {name: options, type: json, description: "Dropdown, Radio: the choices, a list of 1 to 50 distinct texts of at most 100 characters"}
    - {name: option_boxes, type: json, description: "Radio: one box per choice, [[x, y, width, height], ...] in points on the field's page, in the order of the choices"}
    - {name: min_value, type: data, max_length: 40, description: "Number: the smallest value allowed"}
    - {name: max_value, type: data, max_length: 40, description: "Number: the largest value allowed"}
    - {name: decimals, type: int, min: 0, max: 6, description: "Number: places after the point allowed (default 0)"}
    - {name: accept, type: data, max_length: 100, description: "Attachment: the kinds of file allowed, any of pdf, png, jpg separated by commas (default all three); at most 10 MB"}
    - {name: value, type: text, read_only: true, no_copy: true, description: "What the signer entered (name, date, text, Yes/No, a choice, a number, an attachment's file; signatures are kept on the signer)"}

- name: SignDocument
  label: Sign Document
  kind: child
  fields:
    - {name: document, type: attach, required: true, description: "A PDF to sign in the same request: upload it with POST /api/files and set its /files/<id> path"}
    - {name: document_name, type: data, read_only: true, no_copy: true}
    - {name: document_sha256, type: data, label: Document SHA-256, read_only: true, no_copy: true}
    - {name: page_count, type: int, read_only: true, no_copy: true}
    - {name: page_sizes, type: json, read_only: true, hidden: true, no_copy: true, description: "[[width, height], ...] of each page as displayed, in points"}
    - {name: sealed_document, type: attach, read_only: true, no_copy: true, description: "This document signed (no certificate pages: the certificate is on the main document)"}
    - {name: sealed_sha256, type: data, label: Sealed SHA-256, read_only: true, no_copy: true}

- name: SignTemplate
  label: Sign Template
  kind: master
  module: sign
  title_field: template_name
  search_fields: [document_name]
  description: "A reusable PDF with signer roles and field placements. Create Request makes a draft Sign Request from it."
  fields:
    - {name: template_name, type: data, required: true, unique: true, max_length: 140, in_list: true}
    - {name: title, type: data, max_length: 200, description: "Title of requests made from this template (default: the template name)"}
    - {name: message, type: text, max_length: 5000, description: "Message to signers on requests made from this template"}
    - {name: document, type: attach, required: true, description: "The PDF: upload it with POST /api/files and set its /files/<id> path"}
    - {name: document_name, type: data, read_only: true, no_copy: true}
    - {name: document_sha256, type: data, label: Document SHA-256, read_only: true, no_copy: true}
    - {name: page_count, type: int, read_only: true, no_copy: true}
    - {name: page_sizes, type: json, read_only: true, hidden: true, no_copy: true, description: "[[width, height], ...] of each page as displayed, in points"}
    - {name: signing_mode, type: select, options: [Sequential, Parallel], default: Sequential, required: true}
    - {name: expiry_days, type: int, min: 1, max: 365, description: "Days requests made from this template stay open (default: Sign Settings)"}
    - {name: roles, type: table, of: SignTemplateRole, required: true}
    - {name: fields, type: table, of: SignField}
    - {name: disabled, type: check, in_list: true, in_filter: true}
  actions:
    - name: create_request
      label: Create Request
      permission: read
      condition: "!doc.disabled"
      params:
        - {name: title, type: data, label: Title, description: "Default: the template's title, else its name"}
        - {name: message, type: text, label: Message}
        - {name: signing_mode, type: select, label: Signing Order, options: [Sequential, Parallel]}
        - {name: expires_on, type: date, label: Last Day to Sign}
        - {name: reference_entity, type: data, label: About Entity, description: "The record the request is about, e.g. Quotation"}
        - {name: reference_id, type: data, label: About Record}
      contract:
        effect: transactional_action
        returns: {type: object, properties: {entity: {type: string, const: SignRequest}, id: {type: string, format: uuid, x-ferrum-link: SignRequest},
                  number: {type: [string, "null"]}}}
        completion: "A draft Sign Request copied from the template exists, the template's PDF, roles and fields its own; the presser may read what it is about"
  form:
    - {label: Template, fields: [template_name, title, signing_mode, expiry_days, disabled, message]}
    - {label: Document, fields: [document, document_name, page_count, document_sha256]}
    - {label: Roles, fields: [roles]}
    - {label: Fields, fields: [fields]}
  list: {columns: [template_name, signing_mode, page_count, disabled], sort: template_name asc}

- name: SignRequestSigner
  label: Signer
  kind: child
  fields:
    - {name: role, type: data, required: true, max_length: 60, in_list: true, description: "e.g. Client; fields name the role that fills them"}
    - {name: name, type: data, max_length: 140, in_list: true}
    - {name: email, type: email, in_list: true}
    - {name: signing_order, type: int, label: Order, default: 1, min: 1, max: 50, in_list: true, description: "Sequential requests go to lower numbers first; equal numbers sign in parallel"}
    - {name: action, type: select, options: [Sign, Receive a Copy], default: Sign, in_list: true, description: "A recipient who receives a copy signs nothing and gets the signed PDF when everyone has signed"}
    - {name: signing_group, type: data, max_length: 60, description: "Signers with the same group: any one of them signs for all of them"}
    - {name: phone, type: phone, description: "For a code sent by text message"}
    - {name: verify_identity, type: select, options: [As Request, None, Email Code, Text Code], default: As Request,
       description: "Before signing, the signer confirms a one-time code sent to their e-mail address or phone (As Request: the request's setting)"}
    - {name: access_code, type: data, max_length: 64, description: "Optional code the signer must also enter (tell them separately); kept only as a hash"}
    - {name: delivery, type: select, options: [Email, Link, In Person], default: Email, in_list: true,
       description: "Email: their link is mailed. Link: nothing is mailed; the app that asked opens the signing page for them with a link that lasts minutes (Signing Link). In Person: a person signed in at the screen hosts it on their device, saying they checked who signs"}
    - {name: hosted_by, type: email, read_only: true, no_copy: true, description: "In Person: who hosted the signing on their device"}
    - {name: access_code_hash, type: data, read_only: true, hidden: true, no_copy: true}
    - {name: status, type: select, options: [Waiting, Sent, Viewed, Signed, Declined, Not Needed], default: Waiting, read_only: true, no_copy: true, in_list: true}
    - {name: identity_verified_at, type: datetime, read_only: true, no_copy: true}
    - {name: identity_channel, type: data, read_only: true, no_copy: true, description: "Where the code they confirmed was sent: email or text"}
    - {name: reassigned_from, type: text, read_only: true, no_copy: true, description: "Who this signer took over from, and why"}
    - {name: sent_at, type: datetime, read_only: true, no_copy: true}
    - {name: viewed_at, type: datetime, read_only: true, no_copy: true}
    - {name: signed_at, type: datetime, read_only: true, no_copy: true, in_list: true}
    - {name: declined_at, type: datetime, read_only: true, no_copy: true}
    - {name: decline_reason, type: text, read_only: true, no_copy: true}
    - {name: ip_hash, type: data, label: IP Hash, read_only: true, no_copy: true, description: "Salted hash of the address the signer signed or declined from"}
    - {name: user_agent, type: data, max_length: 500, read_only: true, no_copy: true}
    - {name: signature_image, type: text, read_only: true, hidden: true, no_copy: true}
    - {name: signature_text, type: data, read_only: true, no_copy: true}
    - {name: initials_image, type: text, read_only: true, hidden: true, no_copy: true}
    - {name: initials_text, type: data, read_only: true, no_copy: true}
    - {name: reminders_sent, type: int, read_only: true, no_copy: true}
    - {name: last_reminded_at, type: datetime, read_only: true, no_copy: true}
    - {name: failed_attempts, type: int, read_only: true, hidden: true, no_copy: true}
    - {name: locked_until, type: datetime, read_only: true, hidden: true, no_copy: true}
    - {name: submission_hash, type: data, read_only: true, hidden: true, no_copy: true}
    - {name: devices, type: json, read_only: true, hidden: true, no_copy: true, description: "Keyed hashes of the devices that opened the link (the last 20): a new one is in the trail"}
    - {name: attachments, type: json, read_only: true, no_copy: true, description: "Attachment fields: {field id: {file, name, size, sha256, uploads}}, what this signer uploaded"}

- name: SignRequest
  label: Sign Request
  kind: document
  module: sign
  title_field: title
  numbering: {template: "SIGN-{YYYY}-{seq:5}"}
  search_fields: [document_name, reference_id]
  description: "A PDF sent to one or more signers, in order or in parallel. Each signer gets a secure link; when the last one signs, the values are stamped onto the PDF, an audit certificate page is appended and the sealed PDF is kept with its SHA-256."
  fields:
    - {name: title, type: data, required: true, max_length: 200, in_list: true}
    - {name: status, type: select, options: [Draft, Sent, In Progress, Completed, Declined, Expired, Voided], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: message, type: text, max_length: 5000, description: "Shown to signers in the email and on the signing page"}
    - {name: document, type: attach, required: true, description: "The PDF to sign: upload it with POST /api/files and set its /files/<id> path"}
    - {name: document_name, type: data, read_only: true, no_copy: true}
    - {name: document_sha256, type: data, label: Document SHA-256, read_only: true, no_copy: true}
    - {name: page_count, type: int, read_only: true, no_copy: true}
    - {name: page_sizes, type: json, read_only: true, hidden: true, no_copy: true, description: "[[width, height], ...] of each page as displayed, in points"}
    - {name: signing_mode, type: select, options: [Sequential, Parallel], default: Sequential, required: true, in_filter: true}
    - {name: verify_identity, type: select, options: [None, Email Code, Text Code],
       description: "Every signer confirms a one-time code sent to their e-mail address or phone before signing (a signer's own setting wins). Empty: None, except for a request sent as it is made (from another app or a configured step), which asks for an Email Code"}
    - {name: allow_reassign, type: check, description: "A signer may hand their signature over to someone else, saying why"}
    - {name: reminder_every_days, type: int, min: 0, max: 60, description: "Reminders for this request (empty: Sign Settings')"}
    - {name: max_reminders, type: int, min: 0, max: 20, description: "Reminders per signer for this request at most (empty: Sign Settings')"}
    - {name: send_on_create, type: check, no_copy: true, description: "Sent as soon as it is made (from another record's button or step); without fields of its own, a signature page is added for its signers"}
    - {name: source_sha256, type: data, label: Source SHA-256, max_length: 64, no_copy: true, description: "The SHA-256 the document was generated with: it is sent only if the file is that one"}
    - {name: signature_page, type: int, read_only: true, no_copy: true, description: "The page Sign added for the signatures, when it added one"}
    - {name: expires_on, type: date, in_list: true, description: "Last day to sign, in the workspace's time zone; empty = Sign Settings' link expiry after sending"}
    - {name: expires_at, type: datetime, read_only: true, no_copy: true, description: "The moment signing links stop working (the end of the expiry day)"}
    - {name: reference_entity, type: data, max_length: 64, in_filter: true, description: "The record this request is about, e.g. Quotation"}
    - {name: reference_id, type: data, max_length: 36, in_filter: true}
    - {name: template, type: link, to: SignTemplate, read_only: true, on_delete: set_null, in_filter: true}
    - {name: sender_email, type: email, read_only: true, no_copy: true}
    - {name: sent_at, type: datetime, read_only: true, no_copy: true, in_list: true}
    - {name: completed_at, type: datetime, read_only: true, no_copy: true}
    - {name: void_reason, type: text, read_only: true, no_copy: true}
    - {name: sealed_document, type: attach, read_only: true, no_copy: true, description: "The signed PDF with its audit certificate"}
    - {name: sealed_sha256, type: data, label: Sealed SHA-256, read_only: true, no_copy: true}
    - {name: bulk_send, type: link, to: SignBulkSend, read_only: true, no_copy: true, on_delete: set_null, in_filter: true, description: "The bulk send that made this request"}
    - {name: more_documents, type: table, of: SignDocument, description: "Documents 2 onwards, signed in the same request (at most 19); fields name the one they are on with Document No"}
    - {name: seal_error, type: text, read_only: true, hidden: true, no_copy: true, description: "Why sealing last failed (it is retried)"}
    - {name: signers, type: table, of: SignRequestSigner}
    - {name: fields, type: table, of: SignField}
  indexes: [[status, expires_at], [reference_entity, reference_id], [sealed_sha256], [bulk_send]]
  actions:
    - name: send
      label: Send for Signature
      permission: write
      condition: "doc.status == 'Draft'"
      contract:
        effect: transactional_action
        returns: {type: object, properties: {status: {type: string, const: Sent}, expires_at: {type: string},
                  signers: {type: array, items: {type: object, properties: {role: {type: string}, name: {type: string}, email: {type: string},
                  emailed: {type: boolean}, url: {type: string}}}}}}
        completion: "The request is Sent; each signer whose turn it is has their link mailed, or returned here when no mail can go out"
    - name: remind
      label: Send Reminder
      permission: write
      condition: "doc.status == 'Sent' || doc.status == 'In Progress'"
      contract:
        effect: transactional_action
        returns: {type: object, properties: {reminded: {type: array, items: {type: object}}}}
        completion: "A reminder is queued for every signer whose turn it is and who has not signed"
    - name: resend
      label: Resend Links
      permission: write
      condition: "doc.status == 'Sent' || doc.status == 'In Progress'"
      params:
        - {name: signer, type: data, label: Signer, description: "One signer's email or role; everyone whose turn it is when empty"}
      contract:
        effect: transactional_action
        returns: {type: object, properties: {resent: {type: array, items: {type: object}}}}
        completion: "The signing link is queued again for that signer, or for everyone whose turn it is"
    - name: void
      label: Void
      permission: write
      condition: "doc.status == 'Sent' || doc.status == 'In Progress'"
      confirm: "Signers will no longer be able to sign. Continue?"
      params:
        - {name: reason, type: text, label: Reason, description: "Kept on the request and in its trail"}
      contract:
        effect: transactional_action
        returns: {type: object, properties: {status: {type: string, const: Voided}}}
        completion: "Every signing link is refused, sign.request_voided is on the outbox with the reason, and signers who had the link are told"
    - name: signing_link
      label: Signing Link
      permission: write
      hidden: true
      condition: "doc.status == 'Sent' || doc.status == 'In Progress'"
      params:
        - {name: signer, type: data, label: Signer, required: true, description: "The signer's row id, role or email; their delivery must be Link or In Person and it must be their turn"}
        - {name: minutes, type: int, label: Minutes, description: "How long the link opens their page: 1 to 60 (default 15), never past the request's expiry"}
        - {name: embed, type: check, label: In a Frame, description: "The page is shown framed on a site the workspace allows (Sign Settings, Allow Embedding)"}
        - {name: checked_identity, type: check, label: I Checked Who Is Signing, description: "In Person: the host confirms they checked the signer is who the request names"}
      contract:
        effect: transactional_action
        retention_days: 1
        returns: {type: object, properties: {url: {type: string}, expires_at: {type: string}}}
        completion: "The URL opens that signer's signing page until expires_at or until they act; Link Issued is in the trail. In Person: only a person at the screen hosts, and is named on the signer and the certificate"
    - name: verify
      label: Verify Integrity
      permission: read
      read_only: true
      condition: "doc.status != 'Draft'"
      contract:
        effect: query
        returns: {type: object, properties: {valid: {type: boolean}, status: {type: string}, original: {type: object}, sealed: {type: [object, "null"]},
                  audit_trail: {type: object}}}
        completion: "The stored files and the audit trail are recomputed and compared; nothing changes"
  form:
    - {label: Request, fields: [title, status, signing_mode, expires_on, message]}
    - {label: Signers' Identity and Reminders, collapsible: true, fields: [verify_identity, allow_reassign, reminder_every_days, max_reminders]}
    - {label: Document, fields: [document, document_name, page_count, document_sha256]}
    - {label: Signers, fields: [signers]}
    - {label: Fields, fields: [fields]}
    - {label: Linked Record, collapsible: true, fields: [reference_entity, reference_id, template]}
    - {label: Result, fields: [sent_at, expires_at, completed_at, sealed_document, sealed_sha256, void_reason, sender_email]}
  list: {columns: [number, title, status, sent_at, expires_on], sort: created_at desc}

- name: SignEvent
  label: Sign Event
  kind: master
  module: sign
  title_field: event
  owner_fields: [sender]
  description: "The append-only audit trail of sign requests: each event is chained to the previous one by SHA-256, and Verify Integrity recomputes the chain."
  fields:
    - {name: request, type: link, to: SignRequest, required: true, on_delete: cascade, in_list: true, in_filter: true}
    - {name: seq, type: int, label: No., required: true, in_list: true}
    - {name: event, type: select, required: true, in_list: true, in_filter: true,
       options: [Sent, Viewed, Signed, Declined, Reminded, Resent, Corrected, Access Denied, Voided, Expired, Completed, Code Sent, Identity Verified, Reassigned, Not Needed, Link Issued, Sealed, Seal Failed, Attachment Added]}
    - {name: occurred_at, type: datetime, label: Time, required: true, in_list: true}
    - {name: role, type: data, max_length: 60}
    - {name: signer_name, type: data, max_length: 140}
    - {name: signer_email, type: email, in_list: true, in_filter: true}
    - {name: actor, type: data, max_length: 200, description: "Who acted: the signer, a user's email, or system"}
    - {name: ip_hash, type: data, label: IP Hash}
    - {name: user_agent, type: data, max_length: 500}
    - {name: details, type: text, max_length: 2000}
    - {name: sender, type: email, description: "The request's sender (who may read its trail)"}
    - {name: prev_hash, type: data, label: Previous Hash}
    - {name: event_hash, type: data, label: Event Hash}
  unique: [[request, seq]]
  indexes: [[occurred_at]]
  list: {columns: [occurred_at, request, event, signer_email], sort: created_at desc}

- name: SignBulkRecipient
  label: Bulk Recipient
  kind: child
  fields:
    - {name: row_no, type: int, required: true, read_only: true, in_list: true}
    - {name: signers, type: text, max_length: 20000, description: "A JSON object: role → {name, email}, for each role of the template. Cleared once the request is made"}
    - {name: reference_entity, type: data, max_length: 64, description: "The record this recipient's request is about, e.g. Quotation"}
    - {name: reference_id, type: data, max_length: 36}
    - {name: status, type: select, options: [Waiting, Sent, Failed], default: Waiting, read_only: true, no_copy: true, in_list: true}
    - {name: request, type: link, to: SignRequest, read_only: true, no_copy: true, in_list: true}
    - {name: error, type: text, read_only: true, no_copy: true}

- name: SignBulkSend
  label: Bulk Send
  label_plural: Bulk Sends
  kind: master
  module: sign
  title_field: title
  owner_fields: [sender_email]
  description: "One template sent to many recipients, one request each, a few per minute"
  fields:
    - {name: title, type: data, required: true, max_length: 200, in_list: true, description: "Title of every request it makes"}
    - {name: template, type: link, to: SignTemplate, required: true, in_list: true}
    - {name: message, type: text, max_length: 5000, description: "Message to every recipient"}
    - {name: expires_on, type: date, description: "Last day to sign, for every request"}
    - {name: status, type: select, options: [Draft, Sending, Done, Done With Failures, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true}
    - {name: sent, type: int, read_only: true, no_copy: true}
    - {name: failed, type: int, read_only: true, no_copy: true}
    - {name: sender_email, type: email, read_only: true, no_copy: true}
    - {name: recipients, type: table, of: SignBulkRecipient}
  actions:
    - name: start
      label: Start Sending
      permission: write
      condition: "doc.status == 'Draft'"
      contract:
        effect: transactional_action
        returns: {type: object, properties: {status: {type: string, const: Sending}, rows: {type: integer}}}
        completion: "Sending has started: each recipient gets their own request within minutes, a few every minute"
    - name: stop
      label: Stop
      permission: write
      condition: "doc.status == 'Sending'"
      confirm: "No further requests will be made; those already sent stay. Continue?"
      contract:
        effect: transactional_action
        returns: {type: object, properties: {status: {type: string, const: Cancelled}}}
        completion: "No further requests are made; those already sent stay, and the people of the rows not yet sent are forgotten"
  indexes: [[status]]
